<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1b6b3c">
  <title>Missão Fauna Brasil</title>
  <link rel="stylesheet" href="css/estilo.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>

  <main id="tela-atual"></main>

  <!--
    Aviso de orientação: puramente CSS (ver estilo.css), para funcionar mesmo
    que o JavaScript falhe ao carregar. Não é uma "tela" do navegacao.js —
    é chrome do app-shell, sempre presente, mostrado/escondido só por media
    query. É um overlay sobre o #tela-atual, não um substituto dele — o app
    carrega e renderiza normalmente por trás, mesmo em retrato (só fica
    coberto e sem interação). Girar o aparelho some com o aviso
    instantaneamente, sem recarregar a página nem perder o progresso da
    investigação em andamento.
  -->
  <div class="tela-rotacao" id="tela-rotacao">
    <div class="tela-rotacao__cartao">
      <span class="tela-rotacao__icone">
        <svg viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="7" y="2" width="10" height="20" rx="2"></rect>
          <line x1="12" y1="18" x2="12" y2="18"></line>
        </svg>
      </span>
      <p class="tela-rotacao__titulo">Gire seu dispositivo</p>
      <p class="tela-rotacao__texto">O Missão Fauna Brasil foi desenvolvido para ser utilizado na horizontal.</p>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>

  <!--
    Registro do Service Worker: mesma lógica de antes (instalação offline +
    aviso de atualização disponível), só que adiado para o evento "load" da
    janela — recomendação atual do Chrome (web.dev/articles/service-workers-registration)
    para não competir por rede/CPU com o carregamento da própria página. Em
    visitas seguintes (SW já ativo) isso não muda nada: o SW já assume o
    controle antes mesmo de qualquer requisição ser feita.
  -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        let novoWorker;

        navigator.serviceWorker.register("service-worker.js").then((registro) => {
          registro.onupdatefound = () => {
            novoWorker = registro.installing;
            novoWorker.onstatechange = () => {
              if (novoWorker.state === "installed" && navigator.serviceWorker.controller) {
                mostrarBotaoAtualizar(novoWorker);
              }
            };
          };
        });

        navigator.serviceWorker.addEventListener("controllerchange", () => {
          window.location.reload();
        });
      });
    }

    function mostrarBotaoAtualizar(novoWorker) {
      const botao = document.createElement("button");
      botao.innerText = "Atualizar app";
      botao.style.position = "fixed";
      botao.style.bottom = "20px";
      botao.style.left = "50%";
      botao.style.transform = "translateX(-50%)";
      botao.style.padding = "10px 20px";
      botao.style.background = "#1b6b3c";
      botao.style.color = "#fff";
      botao.style.border = "none";
      botao.style.borderRadius = "8px";
      botao.style.zIndex = "9999";
      botao.onclick = () => novoWorker.postMessage("SKIP_WAITING");
      document.body.appendChild(botao);
    }
  </script>

</body>
</html>
